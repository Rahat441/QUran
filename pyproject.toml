[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quran-research-assistant"
version = "0.1.0"
description = "A local, citation-grounded Quran retrieval assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "chromadb>=0.5,<2",
  "ollama>=0.4,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
data = [
  "pyarrow>=18,<22",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
quran-ra = "quran_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quran_assistant"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quran_assistant"]
